# Parameters for the baseline DeGroot simulation.

seed: 42                      # random seed for network, simulation and filter

network:
  type: watts_strogatz        # small-world graph generator
  n_agents: 50                # number of agents (nodes)
  k: 4                        # each node starts connected to its k nearest neighbours
  p: 0.1                      # rewiring probability of each edge

simulation:
  T: 100                      # number of time steps to simulate
  x0_mean: 0.5                # μ_0: mean of the Gaussian prior on initial opinions
  x0_sd: 0.2                  # σ_0: std. dev. of the Gaussian prior on initial opinions

model:                        # true parameters used to generate the data
  dynamics: degroot           # opinion update rule
  self_weight: 0.3            # λ: weight an agent keeps on its own previous opinion
  process_noise_sd: 0.05      # σ_p: noise on each opinion update (external forces)
  expression_noise_sd: 0.05   # σ_e: how much a post deviates from the hidden opinion
  measurement_noise_sd: 0.1   # σ_m: classifier/measurement noise on each post
  observation: continuous     # continuous | ordinal (only continuous implemented)

filter:
  n_particles: 500            # number of particles in the particle filter
